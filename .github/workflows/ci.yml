name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint & deterministic tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: '.'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test + lint dependencies
        # The repo's full requirements.txt (langchain, chromadb, torch, ...) is
        # heavy and flaky to install in CI. The deterministic tests exercise only
        # the no-LLM code paths, so we install just what those modules import at
        # import time: pydantic + pydantic-settings (utils.models / utils.config),
        # numpy + rank-bm25 + sentence-transformers (imported at the top of
        # utils.search, which the evals / reranking / agentic_rag modules import),
        # and ruff + pytest.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic pydantic-settings numpy "rank-bm25>=0.2.2" "sentence-transformers>=5.0.0"

      - name: Ruff lint
        run: ruff check .

      - name: Run deterministic tests
        run: python -m pytest tests/ -q
